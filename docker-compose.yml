name: todo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  restart: unless-stopped
  logging: *logging
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-todo}
      MYSQL_USER: ${DB_USERNAME:-todo}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [mysql-data:/var/lib/mysql]
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -u "$${MYSQL_USER}" -D "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  backend:
    <<: *app
    build: ./Backend/todo-summary-assistant
    image: todo-backend:local
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/todo}
      DB_USERNAME: ${DB_USERNAME:-todo}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DDL_AUTO: ${DDL_AUTO:-update}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      MANAGEMENT_PORT: "8081"
    depends_on:
      mysql: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    mem_limit: 640m
    stop_grace_period: 30s

  frontend:
    <<: *app
    build:
      context: ./Frontend/todo
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL:-/api/todos}
    image: todo-frontend:local
    ports: ["${APP_PORT:-3000}:8080"]
    depends_on:
      backend: {condition: service_healthy}
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 64m

  prometheus:
    <<: *app
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    mem_limit: 256m

  grafana:
    <<: *app
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/todo.json:ro
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 256m

  node-exporter:
    <<: *app
    image: prom/node-exporter:v1.9.1
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
      - ./deploy/runtime/node-metrics:/textfile:ro
    mem_limit: 32m

  blackbox:
    <<: *app
    image: prom/blackbox-exporter:v0.27.0
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes: [./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro]
    mem_limit: 32m

  alertmanager:
    <<: *app
    image: prom/alertmanager:v0.28.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    mem_limit: 64m

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
