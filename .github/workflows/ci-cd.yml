name: CI and EC2 delivery

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todo-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json
      - name: Backend build and integration tests
        working-directory: Backend/todo-summary-assistant
        run: ./mvnw -B -ntp verify
      - name: Frontend tests and production build
        working-directory: Frontend/todo
        env:
          CI: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm test -- --watchAll=false --runInBand
          npm run build
      - name: Release, secret configuration and metrics tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax and static analysis
        run: shellcheck scripts/*.sh
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.10.5'
      - name: Validate infrastructure without accessing AWS
        working-directory: aws/iac
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Scan repository for credential patterns
        run: python3 scripts/check-repository.py

  containers:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Prometheus configuration and alert behavior
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules /etc/prometheus/alert-tests.yml
          docker run --rm --entrypoint /bin/amtool -v "$PWD/monitoring:/etc/alertmanager:ro" prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Validate production Compose and exact secret handling
        run: python3 scripts/check-production-compose.py
      - name: Build both images and run local MySQL stack
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 300
      - name: Test frontend proxy and MySQL CRUD
        run: python3 scripts/smoke-test.py
      - name: Verify exact production secrets inside a non-root container
        run: python3 scripts/check-production-compose.py --runtime
      - name: Verify app containers run as non-root
        run: |
          test "$(docker compose exec -T backend id -u)" != 0
          test "$(docker compose exec -T frontend id -u)" != 0
      - name: Collect runtime metrics and verify scrape targets
        run: |
          sudo python3 scripts/container-metrics.py --output deploy/runtime/node-metrics/docker.prom
          python3 scripts/check-monitoring.py
      - name: Diagnostic logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop test stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-and-deploy:
    needs: [validate, containers]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      BACKEND_REPOSITORY: ${{ vars.BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ vars.FRONTEND_REPOSITORY }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_DOCUMENT: ${{ vars.DEPLOY_DOCUMENT }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require deployment configuration
        run: |
          for variable in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REGISTRY BACKEND_REPOSITORY FRONTEND_REPOSITORY ARTIFACT_BUCKET EC2_INSTANCE_ID DEPLOY_DOCUMENT; do
            test -n "${!variable}" || { echo "Missing repository variable: $variable" >&2; exit 1; }
          done
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to ECR
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Check immutable tags for safe workflow reruns
        id: images
        run: python3 scripts/image-status.py
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.images.outputs.backend_exists != 'true'
        with:
          context: Backend/todo-summary-assistant
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.images.outputs.frontend_exists != 'true'
        with:
          context: Frontend/todo
          push: true
          platforms: linux/amd64
          tags: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: false
      - name: Upload matching configuration bundle
        run: |
          git archive --format=tar HEAD deploy monitoring scripts | gzip > "$RELEASE_SHA.tar.gz"
          sha256sum "$RELEASE_SHA.tar.gz" > "$RELEASE_SHA.tar.gz.sha256"
          aws s3 cp "$RELEASE_SHA.tar.gz" "s3://$ARTIFACT_BUCKET/releases/$RELEASE_SHA.tar.gz" --only-show-errors
          aws s3 cp "$RELEASE_SHA.tar.gz.sha256" "s3://$ARTIFACT_BUCKET/releases/$RELEASE_SHA.tar.gz.sha256" --only-show-errors
      - name: Deploy via SSM and wait for health checks
        run: |
          python3 scripts/dispatch-deploy.py --region "$AWS_REGION" --instance "$EC2_INSTANCE_ID" --document "$DEPLOY_DOCUMENT" --revision "$RELEASE_SHA"
